# The minimum gate behind automatic merges to main (operational-repo control,
# @jwildfire 2026-08-15, obot.roadmap discussion #155): the full node test suite
# plus the policy-file validator, on every push and PR. A repo whose merges to
# production are automatic needs something that makes breakage appear.
name: test

on:
  push:
    branches: [main, stable]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test suite
        run: node --test tools/session-hub/test/*.test.mjs tools/ops-dashboard/test/*.test.mjs tools/statusline/test/*.test.mjs tools/navigator/test/*.test.mjs tools/fold/test/*.test.mjs scripts/test/*.test.mjs
      - name: Policy file validation
        run: python3 scripts/obot-policy validate

      # Every merge verdict the policy file can produce, against a recorded
      # baseline. A diff here is a policy change: intended ones are re-recorded
      # with --update and reviewed in the PR, and nothing else can change them
      # unnoticed (@jwildfire, 2026-08-15, decision D0005.2).
      - name: Policy verdict sweep
        run: python3 scripts/test/policy-sweep
